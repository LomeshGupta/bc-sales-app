  <rect
    x="0"
    y="0"
    width="512"
    height="512"
    rx="110"
    fill="url(#bg)"
  />

  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="280"
    font-weight="800"
    fill="#ffffff"
    filter="url(#glow)"
  >
    S
  </text>
</svg>